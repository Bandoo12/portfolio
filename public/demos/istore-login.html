<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iStore — Вход</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
  }

  .logo {
    margin-bottom: 20px;
    text-align: center;
  }

  .logo svg {
    width: 44px;
    height: 44px;
    fill: #1d1d1f;
  }

  .logo-text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-top: 8px;
    color: #1d1d1f;
  }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 40px 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
    color: #1d1d1f;
  }

  .subtitle {
    font-size: 14px;
    color: #6e6e73;
    text-align: center;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 12px;
  }

  input {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    color: #1d1d1f;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  input:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }

  input::placeholder {
    color: #aeaeb2;
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
    -webkit-appearance: none;
  }

  .btn:hover { background: #0077ed; }
  .btn:active { background: #006edb; }

  .btn:disabled {
    background: #aeaeb2;
    cursor: default;
  }

  .divider {
    border: none;
    border-top: 1px solid #e5e5ea;
    margin: 22px 0;
  }

  .links {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .links a {
    font-size: 13px;
    color: #0071e3;
    text-decoration: none;
  }

  .links a:hover { text-decoration: underline; }

  .error {
    font-size: 13px;
    color: #ff3b30;
    text-align: center;
    margin-top: 10px;
    display: none;
  }

  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #aeaeb2;
    text-align: center;
    line-height: 1.6;
  }

  .footer a {
    color: #aeaeb2;
    text-decoration: none;
  }

  .footer a:hover { text-decoration: underline; }

  @media (max-width: 440px) {
    .card { border-radius: 0; box-shadow: none; padding: 32px 24px; }
    body { background: #fff; justify-content: flex-start; padding-top: 60px; }
  }
</style>
</head>
<body>

<div class="logo">
  <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg">
    <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.3-155.5-127.4C46.7 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 70.1 0 126.4 45.8 170.3 45.8 42.1 0 108.2-49.9 188.3-49.9 30.2 0 133.5 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
  </svg>
  <div class="logo-text">iStore</div>
</div>

<div class="card">
  <h1>Войти в аккаунт</h1>
  <p class="subtitle">Используйте ваш iStore ID для<br>доступа к личному кабинету</p>

  <form id="loginForm">
    <div class="field">
      <input type="email" id="email" placeholder="iStore ID (Email)" autocomplete="email" required>
    </div>
    <div class="field">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Войти</button>
    <p class="error" id="errorMsg">Неверный ID или пароль</p>
  </form>

  <hr class="divider">

  <div class="links">
    <a href="#">Забыли пароль?</a>
    <a href="#">Создать iStore ID</a>
  </div>
</div>

<div class="footer">
  <p>© 2026 iStore. Все права защищены.<br>
  <a href="#">Конфиденциальность</a> · <a href="#">Условия использования</a></p>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Вход...';

    // Имитация проверки — редирект на work.fitplanai.ru
    setTimeout(() => {
      window.location.href = 'https://work.fitplanai.ru';
    }, 800);
  });
</script>

</body>
</html>
