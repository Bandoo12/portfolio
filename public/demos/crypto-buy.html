<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Купить USDT</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
}

/* ── Phone shell ── */
.phone {
  width: 375px;
  height: 812px;
  background: #0d0d0d;
  border-radius: 48px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 40px 100px rgba(0,0,0,0.8);
  position: relative;
}

/* ── Status bar ── */
.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px 8px;
  flex-shrink: 0;
}
.sb-time { font-size: 15px; font-weight: 600; color: #fff; }
.sb-icons { display: flex; align-items: center; gap: 6px; color: #fff; }

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 20px 12px;
  flex-shrink: 0;
}
.back-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
}
.header-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.header-title { font-size: 17px; font-weight: 600; color: #fff; }
.asset-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.asset-icon {
  width: 18px; height: 18px;
  background: #26A17B;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: #fff;
}
.asset-name { font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 500; }
.asset-chevron { color: rgba(255,255,255,0.35); }
.header-action { width: 36px; }

/* ── Scroll content ── */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  padding: 0 20px;
}
.content::-webkit-scrollbar { display: none; }

/* ── Limit bar ── */
.limit-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.limit-bar-wrap {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
}
.limit-bar-fill {
  height: 100%;
  width: 56%;
  background: #7B5BFF;
  border-radius: 2px;
}
.limit-text {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  white-space: nowrap;
}
.limit-text span { color: rgba(255,255,255,0.6); }

/* ── Amount input ── */
.amount-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 8px;
}
.amount-label {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 12px;
  font-weight: 400;
}
.amount-display {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.amount-value {
  font-size: 48px;
  font-weight: 300;
  color: #fff;
  letter-spacing: -1px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.amount-value.has-cursor::after {
  content: '';
  display: inline-block;
  width: 2px;
  height: 44px;
  background: #7B5BFF;
  margin-left: 3px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.amount-currency {
  font-size: 20px;
  font-weight: 400;
  color: rgba(255,255,255,0.5);
}
.amount-converted {
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 20px;
}
.amount-converted span { color: rgba(255,255,255,0.55); }

/* ── Info cards ── */
.info-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.info-card {
  background: #1a1a1a;
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.info-card-label {
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  font-weight: 400;
}
.info-card-value {
  font-size: 15px;
  font-weight: 500;
  color: #fff;
}
.info-card-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  margin-top: 1px;
}
.rate-warn {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: rgba(245,158,11,0.7);
  margin-top: 2px;
}

/* ── Payment method ── */
.payment-row {
  background: #1a1a1a;
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  cursor: pointer;
  transition: background 0.15s;
}
.payment-row:hover { background: #222; }
.payment-icon {
  width: 32px; height: 32px;
  background: #21A038;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.payment-name {
  flex: 1;
  font-size: 15px;
  font-weight: 500;
  color: #fff;
}
.payment-chevron { color: rgba(255,255,255,0.3); }

/* ── Numpad ── */
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  margin-bottom: 12px;
}
.num-key {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 300;
  color: #fff;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.1s;
  user-select: none;
  -webkit-user-select: none;
}
.num-key:active { background: rgba(255,255,255,0.08); }
.num-key.del { font-size: 18px; color: rgba(255,255,255,0.5); }
.num-key.dot { font-size: 26px; color: rgba(255,255,255,0.6); }

/* ── CTA ── */
.cta-btn {
  width: 100%;
  height: 56px;
  background: #7B5BFF;
  border: none;
  border-radius: 16px;
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 8px;
  transition: opacity 0.15s;
  letter-spacing: -0.2px;
}
.cta-btn:active { opacity: 0.85; }
.cta-btn:disabled {
  background: #2a2a2a;
  color: rgba(255,255,255,0.25);
  cursor: not-allowed;
}

/* ── Home indicator ── */
.home-indicator {
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.home-bar {
  width: 120px; height: 5px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
}
</style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="statusbar">
    <div class="sb-time">9:41</div>
    <div class="sb-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4C5.6 2.4 3.4 3.4 1.8 5L0 3.2C2.1 1.2 4.9 0 8 0s5.9 1.2 8 3.2L14.2 5C12.6 3.4 10.4 2.4 8 2.4z" opacity=".3"/><path d="M8 5.6c-1.6 0-3 .6-4.1 1.6L2 5.4C3.5 4 5.6 3.2 8 3.2s4.5.8 6 2.2L12.1 7.2C11 6.2 9.6 5.6 8 5.6z"/><path d="M8 8.8c-.8 0-1.5.3-2 .8L8 12l2-2.4c-.5-.5-1.2-.8-2-.8z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity=".35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 000-4z" fill="currentColor" opacity=".4"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="back-btn">
      <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="9 1 1 9 9 17"/></svg>
    </div>
    <div class="header-center">
      <div class="header-title">Купить</div>
      <div class="asset-selector">
        <div class="asset-icon">₮</div>
        <span class="asset-name">Tether USDT</span>
        <svg class="asset-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="header-action"></div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Limit bar -->
    <div class="limit-row">
      <div class="limit-bar-wrap">
        <div class="limit-bar-fill"></div>
      </div>
      <div class="limit-text"><span>28 200</span> из 50 000 ₽/мес</div>
    </div>

    <!-- Amount -->
    <div class="amount-section">
      <div class="amount-label">Вы платите</div>
      <div class="amount-display">
        <div class="amount-value has-cursor" id="amountDisplay">0</div>
        <div class="amount-currency">₽</div>
      </div>
      <div class="amount-converted">≈ <span id="usdtDisplay">0</span> USDT</div>
    </div>

    <!-- Info row: rate + commission -->
    <div class="info-row">
      <div class="info-card">
        <div class="info-card-label">Курс</div>
        <div class="info-card-value">≈ 76,2 ₽</div>
        <div class="info-card-sub">за 1 USDT</div>
        <div class="rate-warn">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 3.5L20.5 19h-17L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
          Курс плавает
        </div>
      </div>
      <div class="info-card">
        <div class="info-card-label">Комиссия</div>
        <div class="info-card-value">220 ₽</div>
        <div class="info-card-sub">1,6% от суммы</div>
      </div>
    </div>

    <!-- Payment method -->
    <div class="payment-row" onclick="selectPayment()">
      <div class="payment-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5.25 3.84 10.15 9 11.35C17.16 23.15 21 18.25 21 12V6l-9-4z" fill="#fff" opacity=".9"/>
        </svg>
      </div>
      <span class="payment-name">SberPay</span>
      <svg class="payment-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <!-- Numpad -->
    <div class="numpad">
      <div class="num-key" onclick="press('1')">1</div>
      <div class="num-key" onclick="press('2')">2</div>
      <div class="num-key" onclick="press('3')">3</div>
      <div class="num-key" onclick="press('4')">4</div>
      <div class="num-key" onclick="press('5')">5</div>
      <div class="num-key" onclick="press('6')">6</div>
      <div class="num-key" onclick="press('7')">7</div>
      <div class="num-key" onclick="press('8')">8</div>
      <div class="num-key" onclick="press('9')">9</div>
      <div class="num-key dot" onclick="press('.')">·</div>
      <div class="num-key" onclick="press('0')">0</div>
      <div class="num-key del" onclick="del()">
        <svg width="22" height="16" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2H21a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L2 9z"/>
          <line x1="14" y1="6" x2="18" y2="12"/><line x1="18" y1="6" x2="14" y2="12"/>
        </svg>
      </div>
    </div>

    <!-- CTA -->
    <button class="cta-btn" id="ctaBtn" disabled>Продолжить</button>

  </div>

  <!-- Home indicator -->
  <div class="home-indicator"><div class="home-bar"></div></div>

</div>

<script>
const RATE = 76.2;
let raw = '';

const display = document.getElementById('amountDisplay');
const usdtEl  = document.getElementById('usdtDisplay');
const cta     = document.getElementById('ctaBtn');

function format(s) {
  if (!s || s === '0') return '0';
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return parts.join(',');
}

function update() {
  const val = parseFloat(raw) || 0;
  display.textContent = raw ? format(raw) : '0';
  const usdt = val > 0 ? (val / RATE).toFixed(2) : '0';
  usdtEl.textContent = usdt.replace('.', ',');
  cta.disabled = val <= 0;
}

function press(k) {
  if (k === '.' && raw.includes('.')) return;
  if (k === '.' && raw === '') { raw = '0'; }
  if (raw === '0' && k !== '.') raw = k;
  else raw += k;
  if (raw.length > 10) return;
  update();
}

function del() {
  raw = raw.slice(0, -1);
  update();
}

function selectPayment() {}

update();
</script>
</body>
</html>
