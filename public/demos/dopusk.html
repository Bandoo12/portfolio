<style>
/* Допуск. Токены кнопок заданы один раз: основная 15/600/46, в строке 14/600/38. */
:root{--bg:#060705;--pan:#0d0f0a;--pan2:#14170f;--ink:#f2f5ea;--soft:#a3a89b;--dim:#878c80;--l:#d4ff00;--r:#ff5a4f;--line:rgba(255,255,255,.12);--dark:#10120a;--fx:cubic-bezier(.2,.9,.25,1);--jelly:cubic-bezier(.3,1.7,.45,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#040503}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink);font:400 15px/1.42 'Wix Madefor Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
.app{position:relative;flex:none;width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate;transition:background .3s}
.app[data-t=light]{--bg:#f2f3f5;--pan:#fff;--pan2:#eceef1;--ink:#0a0b0d;--soft:#464a51;--dim:#676c74;--line:rgba(10,11,13,.13);--r:#d42a1e}
.num{font-weight:400;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.lab{font-size:14px;color:var(--soft)}
.hide{display:none!important}

/* Кнопки */
.b{height:46px;padding:0 20px;border-radius:23px;font-size:15px;font-weight:600;background:var(--ink);color:var(--dark);white-space:nowrap;transition:background .15s,transform .34s var(--jelly)}
.b:hover{background:#fff}.b:active{transform:scale(.96)}
.b.a{background:var(--l);color:var(--dark);box-shadow:0 8px 26px rgba(212,255,0,.26)}.b.a:hover{background:#e2ff4d}
.b.x{background:var(--r);color:#fff}.b.x:hover{background:#ff7267}
.b.g{background:rgba(255,255,255,.1);color:var(--ink)}.b.g:hover{background:rgba(255,255,255,.18)}
.b:disabled{background:rgba(255,255,255,.08);color:var(--dim);box-shadow:none;cursor:default}
.app[data-t=light] .b{color:#f7f7f0}.app[data-t=light] .b:hover{background:#2a2c31}
.app[data-t=light] .b.a{color:var(--dark);box-shadow:none}.app[data-t=light] .b.a:hover{background:#c6ee00}
.app[data-t=light] .b.g{background:#e6e8eb;color:var(--ink)}.app[data-t=light] .b.g:hover{background:#dadde1}
.app[data-t=light] .b.x{color:#fff}.app[data-t=light] .b.x:hover{background:#c93227}
.s{height:38px;padding:0 15px;border-radius:19px;font-size:14px;font-weight:600}
.lk{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--dim);transition:color .15s,border-color .15s}
.lk:hover{color:var(--l);border-color:var(--l)}
.app[data-t=light] .lk:hover{color:var(--ink);border-color:var(--ink)}

/* Шапка: стекло над сценой, сама не прокручивается */
.nav{position:absolute;left:18px;right:18px;top:12px;z-index:30;height:64px;padding:0 10px 0 22px;display:flex;align-items:center;gap:4px;border-radius:32px;background:rgba(14,16,10,.42);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.08),0 14px 34px rgba(0,0,0,.34)}

.big{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:18px 0}
.big small{color:var(--soft);font-size:14px}.big .num{display:block;margin-top:6px;font-size:40px}
.bar{list-style:none;margin:0;padding:0}
.bar li{position:relative;display:grid;grid-template-columns:1fr auto 44px;gap:12px;padding:7px 0 9px;font-size:14px;border-bottom:1px solid var(--line)}
.bar b{font-weight:500}.bar em{font-style:normal;color:var(--soft);text-align:right}
.bar i{position:absolute;left:0;bottom:-1px;height:2px;width:var(--w);background:var(--l)}
.hts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ht{position:relative;padding:12px 12px 12px 0;text-align:left;transition:background .15s}
.ht:hover{background:rgba(255,255,255,.04)}
.ht::before{content:"";position:absolute;left:0;right:12px;top:-1px;height:3px;background:var(--c);opacity:.45}
.ht.on::before{opacity:1}
.ht small{display:block;min-height:36px;font-size:13px;line-height:1.3;color:var(--soft)}
.ht .num{font-size:36px}.ht em{margin-left:6px;font-style:normal;font-size:14px;color:var(--soft)}
.ht span{display:block;margin-top:4px;font-size:12px;color:var(--dim)}
.gr{display:block;width:100%;max-height:420px;margin-top:10px}
.gr line{stroke:var(--line);stroke-width:1}.gr line.r2{stroke:var(--r)}.gr line.r1{stroke:var(--soft)}
.gr circle{fill:var(--dim)}.gr circle.r1{fill:var(--soft)}.gr circle.r2{fill:var(--r)}.gr circle.me{fill:var(--l)}.gr circle.z{stroke:var(--l);stroke-width:3}
.gr text{fill:var(--ink);font-size:13px}.nd{cursor:pointer}
.sign,.om,.ai{margin-top:18px;padding:18px 22px;border-radius:26px;background:var(--pan)}
.sign h2,.om h2,.ai h2{margin-top:0}
.cf .f{margin-top:14px}.cf>.op{margin-top:10px}
.thumb{display:flex;gap:6px}

/* One Page */
.one{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.one>section{min-width:0}
.pd{margin:12px 0 6px;font-size:15px}.pd .lab{display:inline}.pd b{font-weight:500}
.flow2{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;height:170px;margin:10px 0}
.flow2>div{position:relative;display:flex;align-items:flex-end;gap:5px;padding-bottom:22px}
.flow2 i{flex:1;height:var(--h);border-radius:6px 6px 0 0;background:var(--l)}.flow2 i.o{background:var(--soft)}
.flow2 small{position:absolute;left:0;bottom:0;font-size:12px;color:var(--soft)}
.pc{display:block;width:100%;padding:12px 0;text-align:left;border-bottom:1px solid var(--line)}
.pc small{display:block;font-size:13px;color:var(--soft)}.pc b{display:block;font-size:20px;font-weight:500;letter-spacing:-.01em;transition:color .15s}.pc span{font-size:13px;color:var(--soft)}
.pc:hover b{color:var(--l)}.app[data-t=light] .pc:hover b{color:var(--ink)}
.kvl{list-style:none;margin:0;padding:0}
.kvl li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kvl span{color:var(--soft)}.kvl b{font-weight:500}
.kvl.two{columns:2;column-gap:40px}.kvl.two li{break-inside:avoid}
.lnk{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.rail{list-style:none;margin:0;padding:0}
.rail li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.rail b{font-weight:500;color:var(--soft)}.rail .lock b{color:var(--r)}

/* Кабинет */
.ps{display:grid;grid-template-columns:1fr 1fr 2fr;gap:32px;margin:18px 0}
.ps small{display:block;font-size:14px;color:var(--soft)}
.ps .num{display:block;margin-top:4px;font-size:64px}.ps .num i,.pr3 .num i{font-style:normal;font-size:.5em;color:var(--dim)}
.ps span{font-size:14px;color:var(--soft)}
.ff{display:grid;grid-template-columns:repeat(4,auto);gap:12px 24px;margin-top:10px}
.pr3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin:16px 0}
.pr3 h3{margin:0 0 6px;font-size:14px;color:var(--soft)}.pr3 .num{font-size:44px}.pr3 .ff{grid-template-columns:repeat(3,auto)}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px;list-style:none;margin:14px 0 0;padding:0}
.team button{display:grid;grid-template-columns:40px 1fr;gap:2px 12px;width:100%;padding:14px 0;text-align:left;border-bottom:1px solid var(--line)}
.team u{grid-row:span 2;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pan2);text-decoration:none;font-size:14px;font-weight:600}
.team small{color:var(--soft);font-size:13px}.team span{grid-column:2;font-size:14px}.team i{font-style:normal;color:var(--soft)}
.team button:hover b{color:var(--l)}

/* Степпер */
.stp{display:flex;gap:28px;margin:0 0 18px;padding:0;list-style:none;font-size:15px;color:var(--dim)}
.stp li{display:flex;align-items:center;gap:8px}.stp b{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pan2);font-size:13px}
.stp .on{color:var(--ink)}.stp .on b{background:var(--l);color:var(--dark)}.stp .ok{color:var(--soft)}
.stb{max-width:980px}.stb .f{margin-top:12px}

/* Окно, панель, уведомления */
.dlg{position:absolute;left:50%;top:50%;z-index:45;width:600px;max-width:calc(100vw - 40px);max-height:calc(100vh - 48px);display:none;flex-direction:column;border-radius:32px;background:var(--pan);transform:translate(-50%,-50%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6)}
.dlg.on{display:flex}.dlg.wide{width:min(1180px,calc(100vw - 40px))}
.dlg>header,.side>header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px 10px}
.dlg h2,.side h2{margin:0;font-size:26px;font-weight:400;letter-spacing:-.03em}
.dlb{flex:1;min-height:0;overflow-y:auto;padding:4px 26px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.dlb .f{margin-top:12px}.dlb .kv{margin-top:10px}
.dlg>footer,.side>footer{flex:none;display:flex;gap:8px;padding:12px 26px 22px}
.dlg h3,.side h3{margin:14px 0 6px;font-size:16px;font-weight:600}
.side .kvl{margin:8px 0}
.rep{list-style:none;margin:0;padding:0}.rep li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.rep b{display:block;font-weight:600}.rep span,.rep p{color:var(--soft)}.rep em{display:block;font-style:normal;color:var(--l)}.rep .acts{margin:8px 0 0}
.ntf{position:absolute;right:18px;bottom:18px;z-index:44;width:368px;max-height:60vh;display:none;flex-direction:column;padding:18px 20px;border-radius:28px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5)}
.ntf.on{display:flex}
.ntf header{display:flex;align-items:center;gap:10px}.ntf h2{flex:1;margin:0;font-size:20px;font-weight:500}.ntf em{font-style:normal;color:var(--soft)}
.ntf ul{list-style:none;margin:8px 0;padding:0;overflow-y:auto}.ntf li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.ntf li p{color:var(--soft)}.ntf small{color:var(--dim)}
.toast.bad{background:var(--r);color:#fff}

/* Таймлайн */
.tlk{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.tlk button{position:relative;padding:10px 12px 10px 0;text-align:left;opacity:.45;transition:opacity .15s}
.tlk button.on{opacity:1}
.tlk button::before{content:"";position:absolute;left:0;right:12px;top:0;height:3px;background:var(--c)}
.tlk small{display:block;font-size:13px;color:var(--soft)}.tlk .num{font-size:30px}
.tl{margin-top:12px;overflow-x:auto}
.tlh{display:grid;grid-template-columns:130px repeat(auto-fit,minmax(0,1fr));gap:0;font-size:12px;color:var(--soft);min-width:900px}
.tlr{display:grid;grid-template-columns:130px 1fr;align-items:center;min-height:38px;border-top:1px solid var(--line);min-width:900px}
.tlr b{font-size:13px;font-weight:500}.tlr>div{position:relative;height:38px}
.pt{position:absolute;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--c);transition:transform .34s var(--jelly)}.pt:hover{transform:scale(1.4)}

/* Разделение: панель раздела, ячейка факта, вид цифры */
.ch,.cols>section,.sc,.big>div,.ht{background:var(--pan);box-shadow:inset 0 0 0 1px var(--line)}
.ch{margin-top:2px;padding:18px 22px 14px;border:0;border-radius:24px}
.ch .fl{padding-top:12px;border-top:1px solid var(--line)}
.cols{gap:12px;margin-top:12px}
.cols>section{padding:18px 22px 20px;border-radius:24px}
.cols>section>h2:first-child{margin-top:0}
.cols>section>h2:not(:first-child){margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sc .cols>section,.dlg .cols>section,.side .cols>section,.fx .cols>section{padding:0;background:none;box-shadow:none;border-radius:0}
.sc{margin-top:12px;padding:0 22px;border:0;border-radius:24px}
.sc .sc{padding:0;background:none;box-shadow:none;border-radius:0;border-top:1px solid var(--line)}
.sc>summary{height:56px}
.scb{padding-bottom:18px}

/* Факты лежат в ячейках: линия между соседями, внешний край держит панель */
.chk,.g2:has(>.kv),.g3:has(>.kv){gap:0;overflow:hidden;border-radius:14px}
.chk>.kv,.g2>.kv,.g3>.kv{padding:9px 14px 11px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kv small{font-size:12px;letter-spacing:.01em;color:var(--dim)}
.kv b{margin-top:3px;font-variant-numeric:tabular-nums}

/* Таблица: своя панель, полосы вместо сплошного поля */
.tw{padding:6px 0 0}
.pg>.tw,.tbody>.tw{padding:8px 22px 12px;border-radius:24px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line)}
.pg>.tw>.tb,.tbody>.tw>.tb{top:10px;right:18px}
table{font-variant-numeric:tabular-nums}
tbody tr:nth-child(even):not(.more) td{background:rgba(255,255,255,.028)}.app[data-t=light] tbody tr:nth-child(even):not(.more) td{background:rgba(10,11,13,.03)}
th:first-child,td:first-child{padding-left:12px}
td{border-bottom:0;box-shadow:0 1px 0 rgba(255,255,255,.05)}.app[data-t=light] td{box-shadow:0 1px 0 rgba(10,11,13,.06)}
td.mn{text-align:right;font-weight:600;color:var(--ink)}
th.mh{text-align:right}th.mh button{flex-direction:row-reverse}
td.mn.z{font-weight:400;color:var(--dim)}
td.dt,td.id{color:var(--soft)}
tr.cur td.dt,tr.cur td.id,tr.cur td.mn{color:inherit}

/* Показатели */
.big{gap:12px}
.big>div{padding:16px 22px 18px;border-radius:24px}
.big>div:first-child .num{color:var(--l)}.app[data-t=light] .big>div:first-child .num{color:var(--ink)}
.big .num{font-size:36px}
.bar li{grid-template-columns:1fr 130px 44px;padding:9px 0 10px;font-variant-numeric:tabular-nums}
.bar b{font-weight:600;text-align:right}
.bar li.z span,.bar li.z b,.bar li.z em{font-weight:400;color:var(--dim)}
.hts{gap:8px;border:0}
.ht{padding:14px 14px 12px;border-radius:18px;overflow:hidden}
.ht::before{left:0;right:0;top:0}
.kvl,.rail{font-variant-numeric:tabular-nums}

/* Доводка разделения */
.chk>.kv.wd{grid-column:1/-1}
.cols{align-items:stretch}
.sc .cols,.dlg .cols,.side .cols{align-items:start}
.fb{padding:14px 22px 16px;border-radius:24px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line)}
.sc .fb,.dlg .fb,.side .fb,.fx .fb{padding:0;background:none;box-shadow:none;border-radius:0}
.one{gap:12px;margin-top:12px}
.one>section,.one>aside{padding:18px 22px 20px;border-radius:24px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line)}
.one .pc:first-child{padding-top:0}
.one .tw{padding-top:0}

/* Кабинет: смена и квартал */
.app{--cp:#f2f5ea;--co:#d4ff00;--cr:#7fb2ff}.app[data-t=light]{--cp:#0a0b0d;--co:#74bd00;--cr:#1d5fd1}
.sheet>.seg:first-child{margin-bottom:14px}
.psg{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;margin:0 0 18px}
.shf,.qtr,.pnl,.sheet>.tw{padding:18px 22px 18px;border-radius:24px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line)}
.shf,.qtr{display:flex;flex-direction:column;min-width:0}
.shf header,.qtr header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.shf small,.qtr small{font-size:14px;color:var(--soft)}
.kv small{font-size:12px}
.rd{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums;transition:color .15s}.rd.on{color:var(--l)}.app[data-t=light] .rd.on{color:var(--ink)}
.shh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:6px 0 16px}
.big1{flex:none}.big1 .num{display:block;font-size:72px;line-height:1}.big1 .num i{font-style:normal;font-size:.42em;color:var(--dim)}
.big1 span{display:block;margin-top:2px;font-size:14px;color:var(--soft)}
.shh .g3,.shh .g2{flex:1;max-width:400px}.qtr .shh .g2{max-width:300px}
.say2{margin:12px 0 0;font-size:15px;color:var(--ink)}

/* Шкала смены: щели ворот */
.rail{position:relative;display:flex;align-items:flex-end;gap:3px;height:72px;margin-top:auto}
.rail i{flex:1;min-width:0;height:100%;border-radius:2px;background:var(--c,rgba(255,255,255,.1));transition:opacity .2s,transform .15s;transform-origin:bottom}
.rail i:hover{transform:scaleY(1.08)}
.rail .post{--c:var(--cp)}.rail .online{--c:var(--co);box-shadow:0 0 8px rgba(212,255,0,.35)}.rail .reab{--c:var(--cr)}
.app[data-t=light] .rail .online{box-shadow:none}
.rail .hold{--c:var(--dim);height:26%}.rail .wait{--c:rgba(255,255,255,.14);height:26%}
.rail .next{--c:rgba(255,255,255,.1)}
.app[data-t=light] .rail .next,.app[data-t=light] .rail .wait{--c:rgba(10,11,13,.12)}
.rail .now{flex:none;width:2px;height:calc(100% + 12px);margin:0 4px;border-radius:2px;background:var(--r);box-shadow:0 0 10px var(--r);animation:nowp 2.4s ease-in-out infinite}
@keyframes nowp{50%{opacity:.5}}
.rail[data-f=post] i:not(.post),.rail[data-f=online] i:not(.online),.rail[data-f=reab] i:not(.reab),.rail[data-f=hold] i:not(.hold):not(.wait){opacity:.18}
.rail[data-f=hold] .hold,.rail[data-f=hold] .wait{--c:var(--l);height:60%}

/* Столбики квартала */
.qb{position:relative;display:flex;align-items:flex-end;gap:2px;height:72px;margin-top:auto}
.qb::before{content:"";position:absolute;left:0;right:0;bottom:80%;border-top:1px dashed var(--dim)}
.qb em{position:absolute;right:0;bottom:calc(80% + 3px);font-style:normal;font-size:11px;color:var(--dim)}
.qb i{flex:1;min-width:0;height:var(--h,100%);border-radius:2px 2px 0 0;background:var(--soft);transition:background .12s}
.qb i:hover{background:var(--ink)}
.qb i.up{background:var(--co)}
.qb i.td{background:var(--r);box-shadow:0 0 8px var(--r)}
.qb i.fu{height:100%;background:none;box-shadow:inset 0 0 0 1px var(--line)}

/* Первое появление */
.psg.in .rail i,.psg.in .qb i:not(.fu){opacity:0;transform:scaleY(.2);transform-origin:bottom}
.psg.in.go .rail i,.psg.in.go .qb i:not(.fu){opacity:1;transform:none;transition:opacity .3s var(--d),transform .45s var(--fx) var(--d)}

/* Легенда процессов: она же фильтр шкалы */
.pr3{gap:12px;margin:12px 0}
.pk{padding:16px 20px 12px;border-radius:24px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow .15s,background .15s}
.pk.post{--k:var(--cp)}.pk.online{--k:var(--co)}.pk.reab{--k:var(--cr)}
.pk:hover{background:var(--pan2)}.pk.on{box-shadow:inset 0 0 0 1.5px var(--k)}
.pk h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;color:var(--soft)}
.pk h3 i{width:3px;height:14px;border-radius:2px;background:var(--k)}
.pk .num{display:block;font-size:44px}
.pk .g3{margin:10px -14px 0}
.stk{display:flex;gap:2px;height:8px}.stk i{min-width:2px;border-radius:2px}
.stk .post{background:var(--cp)}.stk .online{background:var(--co)}.stk .reab{background:var(--cr)}
.stk.two{margin-top:10px}.stk.two i:first-child{background:var(--k)}.stk.two i:last-child{background:var(--k);opacity:.4}
td .stk{width:240px;margin-top:6px}
tr.sum td{font-weight:600;background:none!important;box-shadow:0 -1px 0 var(--line)}
.sheet>.tw{margin:12px 0}.sheet>.tw>.tb{top:12px;right:18px}
.pnl{margin:12px 0}.pnl h3:first-child{margin-top:0}
.pnl .team{margin:0}.pnl .cl{margin:0}
.kvl b{font-variant-numeric:tabular-nums;font-weight:600}

/* Подписи ворот поверх свечения */
.gt span{color:var(--ink);text-shadow:0 0 3px #000,0 0 10px #000,0 1px 14px #000}
.gt b{text-shadow:0 0 16px rgba(0,0,0,.8)}

/* Паспорт кейса: чёрное стекло со щелью ворот на кромке */
.app{--al:#ff3b30;--am:#ffb020}
.ch{position:relative;overflow:hidden;padding:20px 26px 16px 34px;gap:16px 40px;background:radial-gradient(90% 150% at 0% 50%,rgba(212,255,0,.075),transparent 62%),var(--pan)}
.ch>*{position:relative}
.ch>.slit{position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--l);box-shadow:0 0 14px var(--l),0 0 44px rgba(212,255,0,.5)}
.ch.al{background:radial-gradient(70% 170% at 0% 40%,rgba(255,59,48,.34),rgba(255,59,48,.08) 46%,transparent 72%),var(--pan);box-shadow:inset 0 0 0 1px rgba(255,59,48,.62),0 0 44px rgba(255,59,48,.2)}
.ch.al>.slit{background:var(--al);box-shadow:0 0 16px var(--al),0 0 60px rgba(255,59,48,.8);animation:alp 2.2s ease-in-out infinite}
@keyframes alp{50%{box-shadow:0 0 8px var(--al),0 0 26px rgba(255,59,48,.45)}}
.tg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}.tg:empty{display:none}
.alert,.sens{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:10px;font-size:14px;font-weight:700;letter-spacing:-.005em;color:#180302}
.alert{background:var(--al);box-shadow:0 0 22px rgba(255,59,48,.6)}.alert svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sens{background:var(--am)}
.ch h1{font-size:50px;line-height:1.04;letter-spacing:-.025em}
.chl .st{margin-top:8px;font-size:15px}
.chk{align-self:center}
.kv.sl b{color:var(--l)}.ch.al .kv.sl b{color:#ff7a70}.app[data-t=light] .kv.sl b{color:var(--ink)}.app[data-t=light] .ch.al .kv.sl b{color:#c62a20}

/* Шары: лампы признаков */
.balls{grid-column:1/-1;display:flex;align-items:flex-end;gap:14px 20px;padding-top:14px;border-top:1px solid var(--line)}
.bg{display:flex;flex-wrap:wrap;gap:6px 4px}

.c3-msg header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.c3-msg b{font-size:13px;font-weight:600}.c3-msg small{flex:none;font-size:12px;color:var(--soft)}
.c3-msg p{margin:4px 0 0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
/* Поля Инфо */
.kv.c3-ed{position:relative;padding-right:40px}
.c3-pen{position:absolute;right:6px;top:8px;width:30px;height:30px}
.c3-pen svg{width:16px;height:16px}
p.txt>.c3-pen{position:static;width:26px;height:26px;margin-left:6px;vertical-align:middle}
/* Триггеры */
.c3-tr{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;min-height:360px}
.c3-tr.c3-solo{grid-template-columns:minmax(0,1fr);min-height:200px}
.c3-tr .acts{margin:10px 0}
.c3-tr .op{min-height:40px;padding:5px 0}.c3-tr .op>i{height:24px}
.c3-tr .op b{font-size:15px;font-weight:500}
#c3tl{max-height:44vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.c3-tg{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:38px;font-size:14px;font-weight:600;color:var(--soft)}
.c3-tg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.op .c3-auto{display:inline-block;margin-right:8px;padding:0 6px;border-radius:6px;font-size:12px;font-style:normal;font-weight:700;color:var(--dark);background:var(--l)}
.app[data-t=light] .op .c3-auto{color:var(--l);background:var(--ink)}
.c3-trr{padding:14px 18px;border-radius:18px;background:var(--pan2)}
.c3-trr h3{margin-top:0}.c3-trr h4{margin:14px 0 4px;font-size:14px;font-weight:600}
.c3-trr ul{margin:4px 0;padding:0;list-style:none}.c3-trr li{padding:3px 0;font-size:14px}
.c3-trr li button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px}
.c3-trr .lab{margin-top:6px;font-size:13px}
/* Помощник */
.c3-ag{position:fixed;right:88px;bottom:84px;z-index:32;display:none;flex-direction:column;width:420px;height:min(560px,calc(100vh - 110px));border-radius:26px;background:var(--pan);box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.55)}
.c3-ag.on{display:flex}
.app[data-t=light] .c3-ag{box-shadow:inset 0 0 0 1px var(--line),0 24px 54px rgba(16,24,40,.18)}
.c3-ag>header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px 20px;cursor:move;user-select:none}
.c3-ag h2{margin:0;font-size:20px;font-weight:500}
.c3-agl{flex:1;min-height:0;overflow-y:auto;padding:0 16px 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.c3-none{padding:40px 0;text-align:center;font-size:14px;color:var(--soft)}
.c3-wait{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:14px;color:var(--soft)}
.c3-mact{display:flex;gap:4px;margin-top:8px}.c3-mact .ic{width:30px;height:30px}.c3-mact .ic svg{width:16px;height:16px}
.c3-agt{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.c3-chip{min-height:30px;padding:3px 12px;border-radius:15px;font-size:13px;font-weight:600;color:var(--ink);background:var(--pan2);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.c3-chip:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--soft)}
.c3-chip:disabled{color:var(--dim);cursor:default}
.c3-agf{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 16px 16px}
.c3-agf .f{flex:1;min-width:0}.c3-agf textarea{min-height:44px}
/* Значки строки и частично размеченный контрагент */
.c3-ia{display:inline-flex;gap:4px}.c3-ia .ic{width:30px;height:30px}.c3-ia .ic svg{width:16px;height:16px}
.box.c3-some:not(.on){position:relative;box-shadow:inset 0 0 0 1.5px var(--r)}
.box.c3-some:not(.on)::after{content:"";position:absolute;left:5px;right:5px;top:9px;height:2px;border-radius:1px;background:var(--r)}
.box.c3-some.on{box-shadow:0 0 0 2px var(--r)}
.b.c3-dis:disabled,.b.c3-dis:disabled:hover{background:rgba(255,255,255,.07);color:var(--dim);box-shadow:none;cursor:default}
.app[data-t=light] .b.c3-dis:disabled,.app[data-t=light] .b.c3-dis:disabled:hover{background:#e6e8eb;color:#5c6168;box-shadow:none}

</style>
<style>
/* Строка фильтров */
.fb.fb-row{display:flex;align-items:flex-end;gap:16px 20px;flex-wrap:nowrap}
.fb.fb-row>.f{flex:1 1 176px;min-width:0;max-width:300px}
.fb.fb-row>.f.fb-h{display:none}
.fb.fb-row>.fbb{flex:none;margin:0 0 0 auto;display:flex;gap:8px}
.fb-all{display:inline-flex;align-items:center;gap:8px}
.fb-all em{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-style:normal;font-size:12px;font-weight:600;color:#10120a;background:var(--r)}
.fb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px}
.fb.fb-row>.f>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</style>
<style>
/* Закреплённая шапка */
.ch.ch-pin{position:sticky;top:-8px;z-index:20;align-content:start;overflow:hidden}
.ch.ch-pin>*:not(.slit):not(.chm){opacity:var(--fa,1)}
.ch.ch-mini>*:not(.slit):not(.chm){visibility:hidden}
.ch>.chm{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 22px 0 26px;opacity:var(--ma,0);pointer-events:none}
.ch.ch-mini>.chm{pointer-events:auto}
.ch>.slit{z-index:1}
.chm-t{flex:none;display:flex;gap:6px}
.chm-t .alert.s{margin:0}
.chm .sens.s{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:7px;font-size:11px}
.chm-n{min-width:60px;font-size:22px;font-weight:400;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chm .st{flex:none;margin:0;font-size:14px;white-space:nowrap}
.chm-k{flex:none;display:flex;margin-left:auto}
.chm-k .kv{padding:0 14px;box-shadow:-1px 0 0 var(--line)}
.chm-k small{display:block;font-size:11px;color:var(--dim);white-space:nowrap}
.chm-k b{display:block;font-size:14px;font-weight:500;white-space:nowrap}
.chm-s{flex:none;display:flex;gap:6px}
.chm-s .sh{width:32px;min-width:32px;height:32px;padding:0;justify-content:center;gap:0}
.chm-s .sh>i{margin:0}
.chm-s .sh>span{display:none}
.chm>.lk{flex:none;font-size:14px;white-space:nowrap}
/* В сжатом виде свечение не должно ложиться пятном на контент */
.ch.al.ch-mini{box-shadow:inset 0 0 0 1px rgba(255,59,48,.62),0 12px 26px rgba(0,0,0,.5)}
.ch.ch-mini{box-shadow:inset 0 0 0 1px var(--line),0 12px 26px rgba(0,0,0,.5)}
.app[data-t=light] .ch.ch-mini{box-shadow:inset 0 0 0 1px var(--line),0 10px 24px rgba(16,24,40,.1)}
.app[data-t=light] .ch.al.ch-mini{box-shadow:inset 0 0 0 1.5px var(--al),0 10px 24px rgba(16,24,40,.1)}
/* Красные заливки на тёмной теме: белое на них не дотягивает до контраста */
.app:not([data-t=light]) .b.x:not(:disabled){color:#10120a}
.app[data-t=light] .fb-all em{color:#fff}
/* Логотип в шапке */
.nav>b{display:flex;align-items:center}
.nav>b>.lg{display:block;height:27px;width:auto;margin:0;color:var(--ink)}
.lg-t{fill:var(--l)}.lg-p{fill:var(--dark)}
.app[data-t=light] .lg-t{fill:var(--ink)}.app[data-t=light] .lg-p{fill:var(--l)}

</style>
<style>
/* Светлая тема: белое на нейтральном, лайм только заливкой, текст почти чёрный. Оливы нет. */
.app[data-t=light]{background:var(--bg)}
.app[data-t=light] .nav a.on{background:var(--ink);color:var(--l)}
.app[data-t=light] .nav{-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--line),0 10px 28px rgba(16,24,40,.08)}
/* Паспорт кейса: чистая карточка, тревогу несёт красная кромка, а не розовая заливка */
.app[data-t=light] .ch{background:var(--pan);box-shadow:inset 0 0 0 1px var(--line),0 12px 30px rgba(16,24,40,.05)}
.app[data-t=light] .ch.al{background:var(--pan);box-shadow:inset 0 0 0 1.5px var(--al),0 14px 34px rgba(212,42,30,.1)}
.app[data-t=light] .ch>.slit{background:var(--ink);box-shadow:none}
.app[data-t=light] .ch.al>.slit{background:var(--al);box-shadow:none}
/* Статус и текущая строка: лаймовая подложка под чёрным текстом */
.app[data-t=light] .st b{display:inline-block;padding:1px 8px;border-radius:7px;color:var(--l);background:var(--ink)}
.app[data-t=light] .big>div:first-child .num{color:var(--ink)}
/* Шары */
.app[data-t=light] .sh:not(.on){color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.app[data-t=light] .sh:not(.on)>i{background:#e6e8eb}
.app[data-t=light] .sh.on.h-l>i{background:var(--ink);box-shadow:none}
.app[data-t=light] .sh.on.h-l>i svg{fill:var(--l)}
/* Кабинет */
.app[data-t=light] .rail .next,.app[data-t=light] .rail .wait{--c:rgba(10,11,13,.1)}
.app[data-t=light] .pc:hover,.app[data-t=light] .pc.on{background:var(--pan);box-shadow:inset 0 0 0 1.5px var(--ink)}
/* Окна */
.app[data-t=light] .dlg,.app[data-t=light] .ntf{box-shadow:inset 0 0 0 1px var(--line),0 30px 70px rgba(16,24,40,.2)}
.app[data-t=light] .pm{box-shadow:inset 0 0 0 1px var(--line),0 22px 50px rgba(16,24,40,.16)}
.app[data-t=light] .sxp{background:var(--pan);box-shadow:inset 0 0 0 1px var(--line),0 18px 40px rgba(16,24,40,.16)}
.app[data-t=light] .pm button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.app[data-t=light] .lb:hover,.app[data-t=light] .nb:hover,.app[data-t=light] .ox-sl:hover{color:var(--ink);text-decoration-color:var(--ink)}
.app[data-t=light] .ox-sl.bad:hover{color:var(--r)}
.app[data-t=light] .nav{background:rgba(255,255,255,.94)}
/* Сцена кабинета остаётся тёмной, поэтому на ней свои цвета текста */
.app[data-t=light] .hero{--ink:#f2f5ea;--soft:#b4b9ac;--dim:#8f948a;--line:rgba(255,255,255,.14);--pan:#0d0f0a;--pan2:#14170f;color:var(--ink)}
/* Красный без размытого свечения: на белом оно выглядит пятном */
.app[data-t=light] .alert,.app[data-t=light] .alert.s{box-shadow:none}
/* Лайм на белом не читается: активное на светлой теме чёрное с лаймом */
.app[data-t=light] .b.a,.app[data-t=light] .card .b.a{background:var(--ink);color:var(--l);box-shadow:none}
.app[data-t=light] .b.a:hover,.app[data-t=light] .card .b.a:hover{background:#2a2c31}
.app[data-t=light] .ic.on,.app[data-t=light] .box.on,.app[data-t=light] .tf nav button.on,.app[data-t=light] .stp .on b,.app[data-t=light] .dop.k,.app[data-t=light] .pl button.on,.app[data-t=light] .me u{background:var(--ink);color:var(--l);box-shadow:none}
.app[data-t=light] .box.on svg,.app[data-t=light] .ic.on svg{stroke:var(--l)}
.app[data-t=light] .toast:not(.bad){background:var(--ink);color:var(--l)}
.app[data-t=light] .op.on>i,.app[data-t=light] .spop p.on i{background:var(--ink);box-shadow:none}
/* Графики это данные, а не активное состояние: цвета рядов как в кабинете */
.app[data-t=light] .bar i,.app[data-t=light] .flow2 i{background:var(--co)}.app[data-t=light] .flow2 i.o{background:#b9bdc4}
.app[data-t=light] .gr circle.me{fill:var(--ink)}.app[data-t=light] .gr circle.z{stroke:var(--ink)}
.app[data-t=light] .rep em{color:var(--ink)}
/* Текущая строка таблицы */
.app[data-t=light] tbody tr.cur td,.app[data-t=light] tbody tr.cur:nth-child(even):not(.more) td,.app[data-t=light] tbody tr.cur:hover td{background:var(--ink);color:#fff;box-shadow:none}
.app[data-t=light] tr.cur td *:not(.alert):not(.alert *){color:#fff}
.app[data-t=light] tr.cur td:first-child{border-radius:10px 0 0 10px}.app[data-t=light] tr.cur td:last-child{border-radius:0 10px 10px 0}
/* Фокус и выделение полей */
.app[data-t=light] .f input:focus,.app[data-t=light] .f textarea:focus,.app[data-t=light] .fd input:focus,.app[data-t=light] .fd textarea:focus{border-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
.app[data-t=light] .tg.on,.app[data-t=light] .fl>button.on:not(.lk),.app[data-t=light] .fl>button:not(.lk):hover{border-color:var(--ink)}
.app[data-t=light] .fl>button:not(.lk):hover{color:var(--ink)}
.app[data-t=light] .team button:hover b{color:var(--ink)}
/* Сцена кабинета тёмная: здесь лайм остаётся */
.app[data-t=light] .hero .b.a{background:var(--l);color:var(--dark)}.app[data-t=light] .hero .b.a:hover{background:#c6ee00}
.app[data-t=light] .hero .st b{background:var(--l);color:var(--dark)}
/* Плитки истории: бледные метки тёмной темы на белом не видны */
.app[data-t=light] .ht[style*="d4ff00"]{--c:var(--ink)}.app[data-t=light] .ht[style*="ffd9a0"]{--c:#b35600}.app[data-t=light] .ht[style*="a7c7ff"]{--c:#1d5fd1}
.app[data-t=light] .ht::before{opacity:.75}.app[data-t=light] .ht.on::before{opacity:1}
/* Нейтральные кнопки: белая заливка с обводкой, иначе тонут в фоне страницы */
.app[data-t=light] .b.g,.app[data-t=light] .ic{background:var(--pan);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(10,11,13,.2)}
.app[data-t=light] .b.g:hover,.app[data-t=light] .ic:hover{background:var(--pan2);box-shadow:inset 0 0 0 1px rgba(10,11,13,.34)}
.app[data-t=light] .ic.on{background:var(--ink);box-shadow:none}

</style>

const Flow = (() => {
  const cv = $('#cvF'), g = cv.getContext('2d'); g.scale(2, 2);
  const X = [543, 768, 991, 1308], Y = 483; let load = 1, on = false;
  const Ps = Array.from({ length: 420 }, () => ({ x: Math.random() * 1440, y: Y + (Math.random() - .5) * 150, s: .5 + Math.random() * 1.2, r: .5 + Math.random() * 1.4, q: 0 }));
  const wall = X[2] - 14;
  function frame(t) {

      if (p.x < wall && p.x + p.s >= wall - (p.y % 46) * load && Math.random() > .06 / load) p.q = 1; else { p.q = 0; p.x += p.s; }

  return { start() { if (!on) { on = true; requestAnimationFrame(frame); } }, stop() { on = false; }, load(v) { load = clamp(v, .3, 2.2); } };

A.pick = (a, el) => el.classList.toggle('on');
A.opTrigGo = () => { const n = $$('#dlg .op.on').length; SEL.ops.forEach((i) => { OPERATIONS.find((o) => o.id === i).trg = n; }); SEL.ops.clear(); A.close(); toast('Действие успешно выполнено'); render(); };

// Создание операции: то же окно из Операций и Выписки
A.opNew = () => dlg('Создание операции', `<div class="g3">${sel('Вид операции', 'n1', ['Безналичная', 'Наличная', 'Вексель'])}${sel('Направление операции', 'n2', ['Списание', 'Зачисление'])}${fld('Дата операции', '', { id: 'n3', ph: '01.01.2026' })}${fld('СИ', 'Система контроля операций', { id: 'n4' })}${fld('ID операции в СИ', '', { id: 'n5' })}${fld('Риск×2', '', { id: 'n6' })}${fld('Сумма операций больше или равно', '', { id: 'n7' })}${sel('Между своими счетами', 'n8', ['Нет', 'Да'])}${fld('Сумма', '', { id: 'n9' })}${sel('Валюта', 'n10', ['RUB', 'USD', 'INR'])}${fld('Рублевый эквивалент', '', { id: 'n11' })}${fld('Рублевый клиент', '', { id: 'n12' })}${fld('Наименование банка клиента', 'Банк Северная столица', { id: 'n13' })}${fld('ФИО доверенного', '', { id: 'n14' })}${fld('Дата рождения доверенного', '', { id: 'n15' })}${sel('Тип контрагента', 'n16', ['ЮЛ или ИП', 'ФЛ'])}${fld('Наименование контрагента', '', { id: 'n17' })}${fld('ИНН контрагента', '', { id: 'n18' })}${fld('Счет контрагента', '', { id: 'n19' })}${fld('БИК/SWIFT банка контрагента', '', { id: 'n20' })}${fld('Наименование банка контрагента', '', { id: 'n21' })}${fld('Назначение платежа', '', { id: 'n22', w: 3 })}</div>`, [['Сохранить', 'opSave', 'a'], ['Отмена', 'shut', 'g']], { wide: 1 });
A.opSave = () => {
  if (!need('n3', 'n9', 'n17')) return;
  const inn = val('n18'); if (inn && !/^\d{10}(\d{2})?$/.test(inn)) return toast('Введите 10 или 12 цифр', 1);
  const id = Math.max(...OPERATIONS.map((o) => o.id), 0) + 1, sum = +val('n9').replace(/\D/g, '') || 0;
  OPERATIONS.unshift({ ...OPERATIONS[0], id, cs: cur().own ? cur().id : undefined, dop: 'Пустые данные', trg: 0, st: 'На согласовании', type: 'Перевод', prod: val('n1'), dir: val('n2'), ka: val('n17'), sum, purpose: val('n22') || '—', code: 1000 + id, fee: Math.round(sum * .001) });
  STMT.unshift({ ...STMT[0], id: 100 + id, zak: false, zap: false, date: val('n3'), ka: val('n17'), inn: inn || '—', sum, dir: val('n2'), purpose: val('n22') || '—', code: 2000 + id, fee: Math.round(sum * .001) });
  A.close(); toast('Операция была успешно сохранена'); render();
};

// Ограничительные меры и обеление живут в кейсе. Окно правит черновик, в кейс он попадает только по кнопке сохранения.
const OMK = ['Лимит на переводы в пределах РФ', 'Оказание услуги ДБО, банковские корпоративные карты'];
const OB_ACT = ['Намерение сохранить клиента', 'Отказ от сохранения клиента', 'Получено ходатайство'];
const omOf = (c) => (c.om ??= { state: 'none', kind: OMK[0] });
const obOf = (c) => (c.ob ??= { on: false, act: OB_ACT[0], text: '' });
// Окно открыто из карточки клиента: берём открытый кейс этого клиента.
const tgt = () => { const c = cur(); if (c.cl === ST.cli) return c; const L = CASES.filter((x) => x.cl === ST.cli); return L.find((x) => !['Закрыт', 'Удален'].includes(x.st)) || L[0] || c; };
function omPaint() {
  const m = omOf(tgt()), D = ST.omD, on = m.state.startsWith('on');
  dlg('Ограничительные меры', `<div class="g2">${kv('Текущее состояние', OM_STATES[m.state])}${kv('Тип ограничения', on ? m.kind : 'Нет ограничений')}</div>
    ${seg('omAct', [['on', 'Применить'], ['off', 'Снять']], D.act)}
    <p class="lab">Тип ограничения</p><div class="cl">${OMK.map((t) => `<button type="button" class="op ${D.kind === t ? 'on' : ''}" data-do="omKind:${t}"><i></i><span><b>${t}</b></span></button>`).join('')}</div>
    <div class="cl"><button type="button" class="op ${D.info ? 'on' : ''}" data-do="omInfo"><i></i><span><b>Есть дополнительная информация</b></span></button></div>
    ${fld('Для применения/снятия ограничительных мер введите комментарий с обоснованием:', D.text, { id: 'q', area: 1 })}`, [['Применить и отправить', 'omGo', 'a'], ['Отменить', 'shut', 'g']]);
}
const omKeep = () => { ST.omD.text = $('#dlg #q').value; };
A.om = () => { const m = omOf(tgt()); ST.omD = { act: m.state.startsWith('on') ? 'off' : 'on', kind: m.kind, info: m.state.endsWith('Info'), text: '' }; omPaint(); };
A.omAct = (a) => { omKeep(); ST.omD.act = a; omPaint(); };
A.omKind = (a) => { omKeep(); ST.omD.kind = a; omPaint(); };
A.omInfo = () => { omKeep(); ST.omD.info = !ST.omD.info; omPaint(); };
A.omGo = () => {
  if (!need('q')) return;
  const c = tgt(), m = omOf(c), D = ST.omD, was = m.state, next = `${D.act === 'on' ? 'on' : 'none'}${D.info ? 'Info' : ''}`;
  if (!live(c)) return;
  if (next === was && (D.act === 'off' || D.kind === m.kind)) return toast('Состояние ограничительных мер не изменилось', 1);
  m.state = next; m.kind = D.kind; A.close();
  notify('Ограничительные меры', next.startsWith('on') ? `ОМ будут применены: ${m.kind}` : was.startsWith('on') ? 'Ограничительные меры сняты' : OM_STATES[next]);
  toast('Действие успешно выполнено'); render();
};

// Обеление: после сохранения окно только показывает решение, действие необратимо.
function obPaint() {
  const c = tgt(), k = cliOf(c), b = obOf(c), D = ST.obD, warn = '<p class="warn">Обратите внимание, действие отменить невозможно</p>';
  if (b.on) return dlg('Обеление', `${kv('Текущее состояние', k.kind === 'ФЛ' ? b.act : 'Кейс переведён в обеление')}${kv('Комментарий', b.text)}${warn}`, [['Закрыть', 'shut', 'g']]);
  if (k.kind === 'ФЛ') return dlg('Обеление', `${kv('Текущее состояние', 'Нет данных')}<div class="cl">${OB_ACT.map((t) => `<button type="button" class="op ${D.act === t ? 'on' : ''}" data-do="obPick:${t}"><i></i><span><b>${t}</b></span></button>`).join('')}</div>${fld('Комментарий', D.text, { id: 'q', area: 1 })}${warn}`, [['Сохранить', 'obGo', 'a'], ['Отмена', 'shut', 'g']]);
  dlg('Обеление', `<p class="sub">Рекомендовано к обелению от комитета</p>${fld('Для перевода кейса в обеление введите комментарий', D.text, { id: 'q', area: 1 })}${warn}`, [['Сохранить', 'obGo', 'a'], ['Отмена', 'shut', 'g']]);
}
A.ob = () => { ST.obD = { act: obOf(tgt()).act, text: '' }; obPaint(); };
A.obPick = (a) => { ST.obD.text = $('#dlg #q').value; ST.obD.act = a; obPaint(); };
A.obGo = () => { if (!need('q')) return; const c = tgt(), b = obOf(c); if (!live(c)) return; Object.assign(b, { on: true, act: ST.obD.act, text: val('q') }); A.close(); notify('Обеление', `Кейс ${c.id} переведён в обеление`); toast('Действие успешно выполнено'); render(); };

</script>
<script>
// Выписка, контрагенты, числовая фактура, заключение, история согласований. Общие для кейса и карточки клиента.
const SF0 = { dir: '', min: '', purp: '', acc: '', ka: '', inn: '', code: '', fee: '', from: '', to: '', st: '', zap: '', zak: '', pb: '' };
const SF = { ...SF0, open: false, cur: '', sel: new Set() };
const sum = (l) => money(l.reduce((a, r) => a + r.sum, 0));
const yes = (v, on) => !v || on === (v === 'Да');
const stRows = () => STMT.filter((o) => c3Own(o) && (!SF.dir || o.dir === SF.dir) && (!SF.min || o.sum >= +SF.min) && (!SF.ka || o.ka.toLowerCase().includes(SF.ka.toLowerCase())) && (!SF.inn || o.inn.includes(SF.inn)) && (!SF.acc || o.acc.includes(SF.acc)) && (!SF.purp || o.purpose.toLowerCase().includes(SF.purp.toLowerCase())) && (!SF.code || String(o.code ?? '').includes(SF.code)) && (!SF.fee || String(o.fee ?? '').includes(SF.fee)) && (!SF.from || dn(o.date) >= dn(SF.from)) && (!SF.to || dn(o.date) <= dn(SF.to)) && (!SF.st || o.st === SF.st) && yes(SF.zap, o.zap) && yes(SF.zak, o.zak) && yes(SF.pb, false));

  const bad = ST.stLoad === 'err';
  return `${seg('stTab', [['ip', 'Выписка ИП'], ['fl', 'Выписка ФЛ'], ['post', 'Пост выписка'], ['day', 'Текущий день']], ST.stmt)}
  <form class="fb">${sel('Списание/Зачисление', 's1', ['', 'Списание', 'Зачисление'], SF.dir)}${fld('Минимальная сумма, ₽', SF.min, { id: 's2' })}${fld('Назначение платежа', SF.purp, { id: 's3' })}${fld('Счет клиента', SF.acc, { id: 's4' })}${fld('Наименование контрагента', SF.ka, { id: 's5' })}${fld('ИНН контрагента', SF.inn, { id: 's6' })}${sfMore()}
    <div class="fbb">${btn('Применить', 'sfApply', 's a')}${btn('Сбросить', 'sfReset')}<button type="button" class="ic" data-do="saveF" title="Сохранить фильтр" aria-label="Сохранить фильтр">${IC.save}</button></div></form>
  <div class="tags"><span class="lab">Сохраненные фильтры</span>${ST.filters.map((f) => `<button type="button" class="tg ${SF.cur === f ? 'on' : ''}" data-do="sfPick:${esc(f)}">${esc(f)}</button>`).join('')}<button type="button" class="lk" data-do="sfEdit">Редактирование фильтра</button></div>
  <div class="acts">${btn('Дозагрузить', 'stLoad', 's a')}${btn('Добавить операцию', 'opNew')}</div>
  <p class="tot"><span>Итого зачисление с учетом фильтров: <b>${sum(cr)}</b></span><span>Итого списание с учетом фильтров: <b>${sum(db)}</b></span><span>Итого зачислено: <b>${sum(STMT.filter((o) => c3Own(o) && o.dir === 'Зачисление'))}</b></span><span>Итого списано: <b>${sum(STMT.filter((o) => c3Own(o) && o.dir === 'Списание'))}</b></span></p>
  ${bad ? `<div class="empty"><h2>Ошибка загрузки</h2><p>Выписка не загрузилась</p>${btn('Дозагрузить', 'stLoad', 's a')}</div>` : tbl('st', cols, R)}`;
}
const sfMore = () => `${fld('Код транзакции', SF.code, { id: 'x1' })}${fld('Операция не раннее', SF.from, { id: 'x2' })}${fld('Операция не позднее', SF.to, { id: 'x3' })}${fld('Комиссия', SF.fee, { id: 'x4' })}${sel('Статус операции', 'x5', ['', 'На согласовании', 'Согласовано'], SF.st)}${sel('Размечено в запрос', 'x6', ['', 'Да', 'Нет'], SF.zap)}${sel('Размечено в заключение', 'x7', ['', 'Да', 'Нет'], SF.zak)}${sel('PB', 'x8', ['', 'Да', 'Нет'], SF.pb)}`;
A.stTab = (a) => { ST.stmt = a; ST.stLoad = a === 'day' && !ST.dayOk ? 'err' : 'ok'; render(); };
// Условия с экрана: основная строка фильтра и раскрытый блок, если он открыт.
const sfRead = () => ({ dir: val('s1'), min: val('s2').replace(/\D/g, ''), purp: val('s3'), acc: val('s4'), ka: val('s5'), inn: val('s6'), ...($('#x1') ? { code: val('x1'), from: val('x2'), to: val('x3'), fee: val('x4'), st: val('x5'), zap: val('x6'), zak: val('x7'), pb: val('x8') } : {}) });
A.sfApply = () => { Object.assign(SF, sfRead()); render(); };
A.sfReset = () => { Object.assign(SF, SF0, { cur: '' }); render(); };
A.allF = () => dlg('Все фильтры', `<div class="g3">${fld('Дата операции с', AF.from, { id: 'a1' })}${fld('Дата операции по', AF.to, { id: 'a2' })}${fld('Сумма от', AF.min, { id: 'a3' })}${fld('Сумма до', AF.max, { id: 'a4' })}${fld('Код транзакции', AF.code, { id: 'a5' })}${fld('Комиссия', AF.fee, { id: 'a6' })}</div>`, [['Применить', 'allGo', 'a'], ['Сброс', 'allNo', 'g']]);
A.allGo = () => { Object.assign(AF, { from: val('a1'), to: val('a2'), min: val('a3').replace(/\D/g, ''), max: val('a4').replace(/\D/g, ''), code: val('a5'), fee: val('a6') }); A.shut(); render(); };
A.allNo = () => { afReset(); A.shut(); render(); };
// Сохранённый фильтр хранит свои условия, тег их подставляет и снимает.
A.sfPick = (a) => { const off = SF.cur === a; Object.assign(SF, SF0, off ? {} : ST.fset[a] || { dir: 'Списание' }); SF.cur = off ? '' : a; render(); };
A.saveF = () => dlg('Создание фильтра', `<p class="lab">Сохранение фильтра</p>${fld('Название фильтра', '', { id: 'q' })}`, [['Сохранить фильтр', 'saveFGo', 'a'], ['Отмена', 'shut', 'g']]);
A.saveFGo = () => { if (!need('q')) return; const n = val('q'); if (!ST.filters.includes(n)) ST.filters.push(n); ST.fset[n] = $('#s1') ? sfRead() : { dir: OF.dir, min: OF.min, purp: OF.purp, ka: OF.ka }; A.close(); toast('Действие успешно выполнено'); render(); };
A.sfEdit = () => dlg('Редактирование фильтра', `<div class="cl">${ST.filters.map((f, i) => `<label class="f"><span>Название фильтра</span><input data-i="${i}" value="${esc(f)}"></label>`).join('')}</div>`, [['Сохранить фильтры', 'sfEditGo', 'a'], ['Отмена', 'shut', 'g']]);
A.sfEditGo = () => { $$('#dlg input[data-i]').forEach((i) => { const o = ST.filters[+i.dataset.i], n = i.value.trim() || o; if (n === o) return; ST.filters[+i.dataset.i] = n; if (ST.fset[o]) { ST.fset[n] = ST.fset[o]; delete ST.fset[o]; } if (SF.cur === o) SF.cur = n; }); A.close(); render(); };
A.stLoad = () => { ST.stLoad = 'ok'; ST.dayOk = true; toast('Действие успешно выполнено'); render(); };
A.zap = (a) => { const r = STMT.find((o) => o.id === +a); r.zap = !r.zap; render(); };
A.zak = (a) => { const r = STMT.find((o) => o.id === +a); if (r.zak) { ST.exId = r.id; return dlg('Подтверждение', `<p class="sub">Вы уверены что хотите исключить операцию из заключения?</p>${fld('Причина исключения операции', '', { id: 'q', area: 1 })}<p class="warn">Обратите внимание, что шлюз не получит уведомления об этом</p>`, [['Исключить', 'zakOut', 'x'], ['Отмена', 'shut', 'g']]); } r.zak = true; render(); };
A.zakOut = () => { if (!need('q')) return; STMT.find((o) => o.id === ST.exId).zak = false; A.close(); render(); };

// КА
const KF = { grp: 'acc', view: 'list', sel: new Set(), q: '', inn: '', acc: '', own: '' };
const kaAcc = (r) => `40702810${String(1000 + r.id).padStart(12, '0')}`;
const risk = (n) => ['Низкий', 'Средний', 'Высокий'][n];
function kaGraph(L) {
  const W = 980, H = 380, n = L.length;
  const nodes = L.map((k, i) => { const a = i / n * Math.PI * 2 - Math.PI / 2; return { k, x: W / 2 + Math.cos(a) * 380, y: H / 2 + Math.sin(a) * 148 }; });
  return `<svg class="gr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Граф контрагентов">${nodes.map((p) => `<line x1="${W / 2}" y1="${H / 2}" x2="${p.x}" y2="${p.y}" class="r${p.k.risk}"/>`).join('')}<circle cx="${W / 2}" cy="${H / 2}" r="9" class="me"/>${nodes.map((p) => `<g data-do="kaZak:${p.k.id}" class="nd"><circle cx="${p.x}" cy="${p.y}" r="${6 + p.k.risk * 2}" class="r${p.k.risk} ${p.k.zak ? 'z' : ''}"/><text x="${p.x}" y="${p.y - 15}" text-anchor="middle">${esc(p.k.n)}</text></g>`).join('')}</svg>`;
}
function vKA() {
  const R = KA.filter((k) => c3Own(k) && (!KF.q || k.n.toLowerCase().includes(KF.q.toLowerCase())) && (!KF.inn || k.inn.includes(KF.inn)) && (!KF.acc || kaAcc(k).includes(KF.acc)) && (!KF.own || ACCOUNTS.some((a) => a[6].includes(KF.own))));
  const col = (t, L) => `<section><h2>${t}</h2>${tbl(`ka${t}`, [{ k: 'zak', t: 'В закл.', f: (r) => `<button type="button" ${c3KaBox(r, 'zak')} data-do="kaZak:${r.id}" aria-label="В заключение"></button>` }, { k: 'zap', t: 'В запрос', f: (r) => `<button type="button" ${c3KaBox(r, 'zap')} data-do="kaZap:${r.id}" aria-label="В запрос"></button>` }, ...c3KaCols(L), { k: 'r', t: 'Риск', f: (r) => risk(r.risk) }, { k: 'manual', t: 'Ручное наименование контрагента', f: c3KaManCell }, { k: 'n', t: 'Наименование' }, ...(KF.grp === 'acc' ? [{ k: 'a', t: 'Счет контрагента', f: kaAcc }] : [])], L, { all: 1 })}</section>`;
  return `<form class="fb">${fld('Счет клиента', KF.own, { id: 'k1' })}${fld('ИНН контрагента', KF.inn, { id: 'k2' })}${fld('Наименование контрагента', KF.q, { id: 'k3' })}${fld('Счет контрагента', KF.acc, { id: 'k4' })}<div class="fbb">${btn('Применить', 'kaApply', 's a')}${btn('Сбросить', 'kaReset')}</div></form>
  ${c3KaHead()}<div class="row">${seg('kaGrp', [['acc', 'Группировка в разрезе счетов'], ['all', 'Группировка без учета счетов']], KF.grp)}${seg('kaView', [['list', 'Контрагенты'], ['graph', 'Граф']], KF.view)}</div>
  ${KF.view === 'graph' ? kaGraph(R) : `<div class="cols">${col('Зачисления', R.filter((_, i) => i % 2 === 0))}${col('Списания', R.filter((_, i) => i % 2))}</div>`}`;
}
A.kaApply = () => { Object.assign(KF, { own: val('k1'), inn: val('k2'), q: val('k3'), acc: val('k4') }); render(); };

const oxNow = () => { const d = new Date(), z = (n) => String(n).padStart(2, '0'); return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const oxRegRows = (n, s) => Array.from({ length: n }, (_, i) => ({ id: s + i, who: O_EXEC[hsh(i + s, 8)], at: `${String(1 + hsh(i + s, 27)).padStart(2, '0')}.${String(10 - Math.floor(i / 3)).padStart(2, '0')}.2026 ${String(9 + hsh(i + s + 1, 9)).padStart(2, '0')}:${String(hsh(i + s + 2, 60)).padStart(2, '0')}`, ft: 'CSV' }));
const OX_REG = { rb: { t: 'Реестр РБ', file: 'ONLINE', rows: oxRegRows(14, 301), fresh: true, err: false, bad: false }, kb: { t: 'Реестр КБ', file: 'REHAB', rows: oxRegRows(12, 401), fresh: true, err: false, bad: false } };

};
const oxRegFile = (g, id) => `${g.file}_${oxNow().slice(0, 10)}_${id || 'ALL'}.csv`;
A.oxRegErr = (p) => { const g = OX_REG[p]; g.err = !g.err; g.bad = false; render(); };
A.oxRegGo = (p) => {
  const g = OX_REG[p];

  g.fresh = false; g.rows.unshift({ id: 1000 + g.rows.length, who: ME.name, at: oxNow(), ft: 'CSV' }); ST.page[`reg${p}`] = 1; render(); toast(`${oxRegFile(g)}: файл сформирован`);
};
A.oxRegDl = (a) => { const [p, id] = a.split('|'); toast(`${oxRegFile(OX_REG[p], id)}: файл сформирован`); };

// Расторжение ДБС: список тех же касаний, что в карточке клиента, и журнал выгрузок запросов в шлюз.
const OX_DF0 = { from: '', to: '', t: '' }, OX_DF = { ...OX_DF0 }, OX_JF = { tp: '', st: '' };
const OX_JT = ['Запрос ИНН', 'Дополнительный запрос ИНН', 'Решение по ИНН'], OX_JS = ['Успешно', 'В обработке', 'Ошибка'];
const OX_DJ = Array.from({ length: 13 }, (_, i) => { const tp = OX_JT[i % 3], st = i === 1 ? 'В обработке' : i === 3 ? 'Ошибка' : 'Успешно', d = oxDay(i + 70), done = st === 'Успешно' && i % 2 === 0; return { id: 500 + i, d, tp, st, sd: `${d} 1${i % 8}:2${i % 6}`, by: O_EXEC[hsh(i + 70, 8)], xd: done ? `${d} 18:0${i % 9}` : null, xb: done ? O_EXEC[hsh(i + 71, 8)] : null }; });
ST.sort.dbsJ = { k: 'sd', d: -1 };
const oxDate = (s) => { const [d, m, y] = s.split('.'); return new Date(+y, m - 1, +d); };
const oxDbsRows = () => DBS.filter((r) => (!OX_DF.t || r.t === OX_DF.t) && (!OX_DF.from || oxDate(r.d) >= oxDate(OX_DF.from)) && (!OX_DF.to || oxDate(r.d) <= oxDate(OX_DF.to)));
function vDbsList() {

}
function vDbsLog() {

}
const oxDjWait = (r) => r.tp !== 'Решение по ИНН' && r.st !== 'Успешно';
ROUTES.dbs = (t = 'list') => `<header class="ph"><h1>Расторжение ДБС</h1>${seg('oxDbsT', [['list', 'Список'], ['log', 'Журнал выгрузок']], t)}</header>${t === 'log' ? `<div class="acts">${btn('Решение в шлюз', 'oxDjDec')}${btn('+ ИНН', 'oxDjInn')}${btn('Перезапросить шлюз', 'oxDjRe')}</div>${vDbsLog()}` : vDbsList()}`;

const oxFail = (id, t) => { const f = fe(id)?.closest('.f'); f?.classList.add('err'); f?.querySelector('.em')?.remove(); f?.insertAdjacentHTML('beforeend', `<em class="em">${esc(t)}</em>`); };
const oxDjAdd = (tp, d, st) => { const r = { id: 600 + OX_DJ.length, d, tp, st, sd: oxNow(), by: ME.name, xd: null, xb: null }; OX_DJ.unshift(r); ST.page.dbsJ = 1; if (st !== 'Успешно') setTimeout(() => { r.st = 'Успешно'; r.sd = oxNow(); if (location.hash.startsWith('#dbs/log')) render(); }, 2500); };
const oxDjDate = (id) => { const v = val(id), lo = new Date(); lo.setHours(0, 0, 0, 0); lo.setDate(lo.getDate() - 1); if (!dateOk(v)) { oxFail(id, 'Введите дату в формате ДД.ММ.ГГГГ'); return ''; } if (oxDate(v) < lo) { oxFail(id, 'Дата не может быть раньше вчерашнего дня'); return ''; } return v; };
A.oxDjDec = () => dlg('Решение в шлюз', sel('Добавьте файл', 'ox-jf', ['', `decision_${oxNow().slice(0, 10)}.csv`, 'decision_inn_list.csv']), [['Отправить', 'oxDjDecGo', 'a'], ['Отмена', 'shut', 'g']]);

A.oxDjInn = () => dlg('+ ИНН', `${fld('ИНН', '', { id: 'ox-ji', area: 1, ph: 'Введите список ИНН через запятую (не более 100 ИНН, от 10 до 12 цифр)' })}${fld('Запрос на дату', oxNow().slice(0, 10), { id: 'ox-jd' })}`, [['Отправить', 'oxDjInnGo', 'a'], ['Отмена', 'shut', 'g']]);
A.oxDjInnGo = () => { if (!need('ox-ji', 'ox-jd')) return; const L = val('ox-ji').split(','), d = oxDjDate('ox-jd'); if (L.length > 100 || !L.every((x) => /^(?!00)(\d{10}|\d{12})$/.test(x.trim()))) return oxFail('ox-ji', 'Присутствует некорректный ИНН'); if (!d) return; oxDjAdd('Дополнительный запрос ИНН', d, 'В обработке'); A.close(); render(); toast(`Запрос данных в шлюз по ${L.length} ИНН на ${d} успешно отправлен`); };
A.oxDjRe = () => dlg('Перезапросить шлюз', fld('Запрос на дату', oxNow().slice(0, 10), { id: 'ox-jd' }), [['Отправить', 'oxDjReGo', 'a'], ['Отмена', 'shut', 'g']]);

const oxApplied = () => (oxLfN() ? `<span class="ox-ap">Примененные фильтры: ${oxLfN()}</span>` : '');
const oxTagBar = () => (OX_TAGS.length ? `<div class="ox-tags">${OX_TAGS.map((t) => `<span class="ox-tag ${JSON.stringify(t.f) === JSON.stringify(oxLf()) ? 'on' : ''}"><button type="button" data-do="oxTagUse:${t.id}">${esc(t.name)}</button><button type="button" class="ox-tge" data-do="oxTagEd:${t.id}" title="Редактировать тег" aria-label="Редактировать тег">${IC.edit}</button></span>`).join('')}</div>` : '');
let oxTagCur = null;
const oxTagDlg = (t) => { oxTagCur = t; dlg('Редактирование тега', fld('Имя тега', t?.name || '', { id: 'ox-tn' }), [...(t ? [['Удалить', 'oxTagDel', 'x']] : []), ['Закрыть', 'shut', 'g'], ['Сохранить', 'oxTagGo', 'a']]); };
A.oxTag = () => { const dirty = val('l1') !== LF.no || val('l2') !== (LF.st || '') || val('l3') !== LF.spec || val('l4') !== LF.who; if (!oxLfN() || dirty) return toast(OX_TMSG, 1); oxTagDlg(null); };
A.oxTagGo = () => { if (!need('ox-tn')) return; if (oxTagCur) oxTagCur.name = val('ox-tn'); else OX_TAGS.push({ id: OX_TAGS.reduce((a, t) => Math.max(a, t.id), 0) + 1, name: val('ox-tn'), f: oxLf() }); A.close(); render(); };
A.oxTagDel = () => { OX_TAGS.splice(OX_TAGS.indexOf(oxTagCur), 1); A.close(); render(); };
A.oxTagEd = (id) => oxTagDlg(OX_TAGS.find((t) => t.id === +id));
A.oxTagUse = (id) => { Object.assign(LF, OX_TAGS.find((t) => t.id === +id).f); ST.page.opsO = 1; render(); };

// Настройки таблицы списков: видимость и порядок колонок применяются по кнопке Сохранить.
const OX_ORD = {}, OX_CFG = ['opsO', 'oxLR', 'oxLP'];
function oxOrd(k, cols) { return OX_ORD[k] ? OX_ORD[k].map((x) => cols.find((c) => c.k === x)) : cols; }
let oxDraft = null;
const oxCfgPaint = () => {

const c3Fresh = (c) => { const s = C3_SEED[c.id] || {}; return { hist: [], pre: (s.pre || []).map((x) => ({ ...x })), us: (s.us || []).map((x) => ({ ...x })), cons: JSON.parse(JSON.stringify(s.cons || [])), chat: [], tags: null, f: {}, trg: null, priz: {}, prizSel: [], ai: [], kaName: {}, post: null, keep: null, consent: '' }; };

const c3Plural = (n, a, b, d) => { const x = n % 100, y = n % 10; return x > 10 && x < 20 ? d : y === 1 ? a : y > 1 && y < 5 ? b : d; };

const c3Clr = (...ids) => ids.forEach((id) => { const f = fe(id)?.closest('.f'); f?.classList.remove('err'); f?.querySelector('.em')?.remove(); });
const c3Err = (id, m) => { const e = fe(id), f = e?.closest('.f'); f?.classList.add('err'); f?.querySelector('.em')?.remove(); f?.insertAdjacentHTML('beforeend', `<em class="em">${esc(m)}</em>`); return false; };
// Дата в границах: те же тексты, что у проверки дат в источнике.
const c3DateErr = (id, min, max) => { const v = val(id); if (!dateOk(v)) return c3Err(id, 'Некорректная дата'); const d = c3Bd(v); if (min && d < c3Bd(min)) return c3Err(id, 'Дата меньше допустимой'); if (max && d > c3Bd(max)) return c3Err(id, 'Дата больше допустимой'); return true; };
const c3Dis = (t, why, c = 's g') => `<button type="button" class="b ${c} c3-dis" disabled title="${esc(why)}">${esc(t)}</button>`;

const c3Balls = (c) => (c.proc === 'post' ? shar('Группа', 'Группа кейсов', 'people', `act ${c3Grp(c) ? 'on h-l' : ''}`, 'c3Group') : '');

A.c3Us = () => dlg('Сообщения УС', `<ul class="rep">${c3s(cur()).us.map((m) => `<li><b>${esc(m.at)}</b><p>${esc(m.t)}</p></li>`).join('')}</ul>`, [['Закрыть', 'shut', 'g']]);
A.c3Mark = () => { const c = cur(); dlg('Разметки', `<ul class="c3-list">${c3Marks(c).map((m) => `<li><span>${esc(m.t)}</span><small>${esc(m.at)}</small>${m.pub ? `<button type="button" class="ic" data-do="c3Pub" title="Публикации СМИ" aria-label="Публикации СМИ">${C3_ICO.go}</button>` : ''}</li>`).join('')}</ul>`, [['Закрыть', 'shut', 'g']]); };

// Меню редких действий за плюсом в шапке
const C3_CLONE_ST = ['Подозрительный', 'Обеление', 'Не подозрительный', 'Ожидание решения'];

const c3AgreeWhy = (c) => (c.proc !== 'post' ? 'Только в кейсах Пост' : cliOf(c).kind !== 'ФЛ' ? 'Только для клиентов ФЛ' : c3Closed(c) ? 'Кейс закрыт, только просмотр' : c3s(c).consent ? 'Согласие по клиенту уже получено' : !C3_AGREE_ST.includes(c.st) ? `Статус «${c.st}» не подходит` : usOk() ? '' : 'Нужна роль УС');
function c3MenuHtml(c) {
  const row = (t, act, why = '') => `<button type="button" ${why ? 'disabled' : `data-do="${act}"`}><b>${esc(t)}</b>${why ? `<small>${esc(why)}</small>` : ''}</button>`;
  return `<h4>Действия над кейсом</h4>${row('Создание кейса', 'go:new')}${row('Клонировать кейс', 'c3Clone', c3CloneWhy(c))}${row('Мероприятие реагирования', `go:client/${c.cl}/ev`)}${row('Получение согласия', 'c3Agree', c3AgreeWhy(c))}`;
}
const c3MenuEl = () => { let m = $('#c3m'); if (!m) { m = document.createElement('div'); m.id = 'c3m'; m.className = 'c3-menu'; $('#app').append(m); } return m; };
const c3MenuShut = () => $('#c3m')?.classList.remove('on');
A.c3Menu = (a, el) => {

// Клон: новый кейс Пост с чистым рабочим состоянием и ссылкой на исходный.
A.c3Clone = () => {
  const c = cur(), why = c3CloneWhy(c); if (why) return toast(why, 1);
  dlg('Клонировать кейс', `<p class="sub">Выберите причину клонирования кейса.</p>${sel('Причина клонирования кейса', 'c3cr', ['', ...C3_CLONE_WHY], '')}${c3Max(fld('Комментарий', '', { id: 'c3cc', area: 1, rows: 4, ph: 'Дополнительные сведения' }), 2000)}`, [['Клонировать', 'c3CloneGo', 'a'], ['Отменить', 'shut', 'g']]);
};
A.c3CloneGo = () => {
  if (!need('c3cr')) return;
  const c = cur(), id = Math.max(...CASES.map((x) => x.id)) + 1, { proc, cl, sla, from, to, spec, si, sens, susp, own } = c;
  // Переносим только паспорт кейса: документы, заключение и меры у клона свои.
  const n = { id, proc, cl, sla, from, to, spec, si, sens, susp, own, st: 'Новый', who: '', docs: 'Нет', clone: c.id, root: c.root || c.id };
  CASES.push(n);
  if (c.own) { const base = Math.max(...OPERATIONS.map((o) => o.id), 0) + 1; OPERATIONS.filter((o) => o.cs === c.id).forEach((o, i) => OPERATIONS.push({ ...o, id: base + i, cs: id, st: 'На согласовании' })); }
  const why = val('c3cr'), com = val('c3cc');
  c3Log(c, 'Кейс склонирован', `Новый кейс ${id}. Причина: ${why}`); c3Log(n, 'Кейс создан клонированием', `Исходный кейс ${c.id}. Причина: ${why}${com ? `. ${com}` : ''}`);
  A.close(); toast('Кейс успешно склонирован'); go(`case/${id}/info`);
};

// Группа кейсов: связь живёт отдельно от кейса, потому что это отношение между кейсами.
const C3_G = [];
const C3_GS = new Set();
const c3Grp = (c) => C3_G.find((g) => g.rows.some((r) => r.id === c.id));
const c3GEdit = (c) => !c3Closed(c) && (usOk() || c.who === ME.name);
function c3GPaint() {
  const c = cur(), g = c3Grp(c), rows = (g?.rows || []).map((r) => ({ ...r, c: caseOf(r.id) }));
  const cols = [{ k: 'id', t: 'Связанные кейсы', f: (r) => `<button type="button" class="lk" data-do="go:case/${r.id}/info">${r.id}</button>${c3CloneTag(r.c)}` }, { k: 's', t: 'Статус кейса', f: (r) => esc(r.c.st) }, { k: 'by', t: 'Инициатор' }, { k: 'at', t: 'Дата и время' }, { k: 'w', t: 'Причина', f: () => 'Контрагент по схеме' }, { k: 'k', t: 'Тип клиента', f: (r) => cliOf(r.c).kind }, { k: 'i', t: 'ИНН', f: (r) => esc(cliOf(r.c).inn) }, { k: 'n', t: 'Наименование клиента', f: (r) => esc(cliOf(r.c).name) }];
  const more = (r) => CASES.filter((x) => x.clone === r.id && !g.rows.some((y) => y.id === x.id)).map((x) => `<p class="c3-sub">Клон <button type="button" class="lk" data-do="go:case/${x.id}/info">${x.id}</button> из кейса ${r.id}, статус ${esc(x.st)}</p>`).join('');
  const body = g ? `<p class="lab">Текущее состояние:</p><div class="c3-gt">${table('c3g', cols, rows, { all: 1, check: (r) => `c3GSel:${r.id}`, isOn: (r) => C3_GS.has(r.id), more })}</div>` : '<div class="empty"><p>Нет связанных кейсов</p></div>';
  const ed = c3GEdit(c);
  dlg(g ? `Группа кейсов № ${g.parent}` : 'Группа кейсов', `${body}${ed ? '' : `<p class="c3-sub">${c3Closed(c) ? 'Кейс закрыт, группа только для просмотра' : 'Менять группу может УС или исполнитель кейса'}</p>`}`, [['Добавить в группу', 'c3GAdd', 'a'], ['Исключить из группы', 'c3GOut', 'g'], ['Закрыть', 'shut', 'g']], { wide: 1 });
  c3Off(0, !ed); c3Off(1, !ed || !C3_GS.size);
}
A.c3Group = () => { C3_GS.clear(); c3GPaint(); };
A.c3GSel = (a) => { const i = +a; if (C3_GS.has(i)) C3_GS.delete(i); else C3_GS.add(i); c3GPaint(); };
A.c3GAdd = () => dlg('Добавить в группу', `<div class="c3-two"><span class="lab">Выберите тип связи:</span>${kv('Тип связи', 'Контрагент по схеме')}<span class="lab">Введите номер кейса:</span>${fld('Номер кейса', '', { id: 'c3gi', ph: 'Несколько номеров через запятую' })}</div>`, [['Связать', 'c3GAddGo', 'a'], ['Отменить', 'c3Group', 'g']]);
A.c3GAddGo = () => {
  if (!need('c3gi')) return;
  const c = cur(), ids = [...new Set(val('c3gi').split(',').map(Number).filter(Boolean))];
  if (!ids.length) return c3Err('c3gi', 'Введите номер кейса');
  const g0 = c3Grp(c), had = new Set(g0?.rows.map((r) => r.id) || [c.id]);
  for (const i of ids) { const x = CASES.find((y) => y.id === i); if (!x) return c3Err('c3gi', `Кейс ${i}: информация не найдена`); if (x.proc !== 'post') return c3Err('c3gi', `Кейс ${i} не из процесса Пост`); if (had.has(i)) return c3Err('c3gi', `Кейс ${i} уже в группе`); if (C3_G.some((g) => g !== g0 && g.rows.some((r) => r.id === i))) return c3Err('c3gi', `Кейс ${i} уже в другой группе`); }
  const row = (id) => ({ id, by: ME.name, at: c3Now() }), g = g0 || { parent: c.id, rows: [row(c.id)] }; if (!g0) C3_G.push(g);
  ids.forEach((i) => { g.rows.push(row(i)); c3Log(caseOf(i), 'Кейс добавлен в группу', `Группа № ${g.parent}, тип связи: Контрагент по схеме`); });
  c3Log(c, 'Кейсы добавлены в группу', `${ids.join(', ')}, группа № ${g.parent}`);
  toast('Кейсы успешно добавлены в группу'); render(); A.c3Group();
};
A.c3GOut = () => { const g = c3Grp(cur()); dlg('Исключить кейс из группы', `<p class="sub">Вы действительно хотите исключить кейсы: ${[...C3_GS].join(', ')} из группы № ${g.parent}?</p>`, [['Да', 'c3GOutGo', 'a'], ['Нет', 'c3GBack', 'g']]); };
A.c3GBack = () => c3GPaint();
A.c3GOutGo = () => {
  const c = cur(), g = c3Grp(c), out = [...C3_GS];
  g.rows = g.rows.filter((r) => !C3_GS.has(r.id));
  out.forEach((i) => c3Log(caseOf(i), 'Кейс исключён из группы', `Группа № ${g.parent}`));
  if (!out.includes(c.id)) c3Log(c, 'Кейсы исключены из группы', `${out.join(', ')}, группа № ${g.parent}`);
  if (g.rows.length < 2) C3_G.splice(C3_G.indexOf(g), 1);
  toast('Кейсы успешно удалены из группы'); render(); A.c3Group();

  const act = (t) => { const b = t === 'go' ? form.querySelector('.fbb .b.a') : [...form.querySelectorAll('.fbb .b')].find((x) => /Сбросить|Обновить/.test(x.textContent)); const [n, ...r] = (b?.dataset.do || '').split(':'); if (n && A[n]) A[n](r.join(':'), b); };
  A.fbGo = () => {
    const L = [...form.querySelectorAll(':scope>.f')];
    L.forEach((x, i) => { const e = document.querySelector(`#dlg #fbx${i}`); if (e) { const s = x.querySelector('input,select,textarea'); s.value = e.value; } });
    if (form.dataset.bar === 'af') Object.assign(AF, { from: val('a1'), to: val('a2'), min: val('a3').replace(/\D/g, ''), max: val('a4').replace(/\D/g, ''), code: val('a5'), fee: val('a6') });
    A.shut(); act('go'); render();
  };
  A.fbNo = () => { if (form.dataset.bar === 'af') afReset(); A.shut(); act('no'); render(); };
  new MutationObserver(scan).observe(pg, { childList: true, subtree: false });
  addEventListener('resize', scan);
  document.addEventListener('input', (e) => { const f = e.target.closest?.('#page form.fb'); if (f) fit(f); });
  document.addEventListener('change', (e) => { const f = e.target.closest?.('#page form.fb'); if (f) fit(f); });
})();

</script>
<script>
// Шапка кейса и клиента: прилипает под навигацией и сжимается вместе с прокруткой.
// Высота убывает ровно на пройденные пиксели, а разницу забирает нижний отступ, поэтому контент не прыгает и под шапкой нет пустоты.
(() => {
  const pg = document.querySelector('#page'), TOP = 84, MINI = 64;
  let ch = null, full = 0, s0 = 0, mb = 0, tick = 0;
  const miniRow = (c) => {
    const name = c.querySelector('h1')?.textContent || '', st = c.querySelector('.st b')?.textContent || '';
    const facts = [...c.querySelectorAll('.chk>.kv')].filter((k) => /^(ID кейса|ИНН|SLA)/.test(k.querySelector('small')?.textContent || '')).slice(0, 2);
    const m = document.createElement('div'); m.className = 'chm';
    const tags = [...c.querySelectorAll('.tg>*')].map((t) => { const x = t.cloneNode(true); x.classList.add('s'); if (x.classList.contains('sens')) x.textContent = 'Чувствительный'; else x.lastChild.textContent = 'Подозрительный'; return x.outerHTML; }).join('');
    m.innerHTML = `${tags ? `<div class="chm-t">${tags}</div>` : ''}<b class="chm-n" title="${esc(name)}">${esc(name)}</b>${st ? `<span class="st"><b>${esc(st)}</b></span>` : ''}<div class="chm-k"></div><div class="chm-s"></div>`;
    facts.forEach((k) => m.querySelector('.chm-k').append(k.cloneNode(true)));
    c.querySelectorAll('.shr .sh.on, .shr .specw .sh.on').forEach((s) => m.querySelector('.chm-s').append(s.cloneNode(true)));
    const lk = c.querySelector('.bx .lk'); if (lk) m.append(lk.cloneNode(true));
    return m;
  };
  const paint = () => {
    tick = 0; if (!ch) return;
    const d = Math.max(0, pg.scrollTop - s0), h = Math.max(MINI, full - d), p = Math.min(1, d / (full - MINI));
    if (!d) { ch.style.height = ''; ch.style.marginBottom = ''; } else { ch.style.height = `${h}px`; ch.style.marginBottom = `${mb + full - h}px`; }
    // Контент виден и обрезается снизу, пока блок не станет почти компактным. Смена на строку только в самом конце, поэтому пустого места не бывает.
    const fa = Math.min(1, Math.max(0, (h - 100) / 44)), ma = Math.min(1, Math.max(0, (124 - h) / 36));
    ch.style.setProperty('--fa', fa.toFixed(3)); ch.style.setProperty('--ma', ma.toFixed(3)); ch.style.setProperty('--p', p.toFixed(3)); ch.classList.toggle('ch-mini', h < 110);
  };
  const init = () => {
    const c = pg.querySelector(':scope>.ch');
    if (c === ch) return;
    ch = c; pg.style.paddingBottom = ''; if (!ch) return;
    ch.classList.add('ch-pin'); ch.append(miniRow(ch));
    const y = pg.scrollTop; ch.style.position = 'static'; full = ch.offsetHeight; mb = parseFloat(getComputedStyle(ch).marginBottom) || 0; s0 = ch.offsetTop - TOP; ch.style.position = ''; pg.scrollTop = y;
    // Страница прокручивается, но не хватает хода до полного сжатия: добавляем недостающее снизу.
    const room = pg.scrollHeight - pg.clientHeight, need = s0 + full - MINI;
    if (room > s0 + 24 && room < need) pg.style.paddingBottom = `${parseFloat(getComputedStyle(pg).paddingBottom) + need - room}px`;
    paint();
  };
  pg.addEventListener('scroll', () => { if (!tick) tick = requestAnimationFrame(paint); }, { passive: true });
  new MutationObserver(init).observe(pg, { childList: true });
  addEventListener('resize', () => { ch = null; pg.querySelector(':scope>.ch .chm')?.remove(); pg.querySelector(':scope>.ch')?.setAttribute('style', ''); init(); });
  init();
})();

</script>
<script>
// Легенда шара: при наведении показывает, что это за признак и какие у него бывают состояния.
(() => {
  const yn = (on, off = 'Нет') => [[off, ''], [on, 'h']];
  const OM = ['Не применены', 'Применены', 'Не применены, но есть дополнительная информация', 'Применены, но есть дополнительная информация'];
  const LG = {
    ЗСК: { s: [['Нет', ''], ['Средний риск', 'o'], ['Высокий риск', 'r']], cur: (b) => (b.classList.contains('h-o') ? 1 : b.classList.contains('on') ? 2 : 0) },
    ОМ: { s: [[OM[0], ''], [OM[1], 'r'], [OM[2], 'i'], [OM[3], 'ri']], cur: (b) => OM.findIndex((x) => b.dataset.r.endsWith(`: ${x}`)) },
    ОБ: { s: [['Нет данных', ''], ['Намерение сохранить клиента', 'l'], ['Отказ от сохранения клиента', 'l'], ['Получено ходатайство', 'l']], cur: (b) => (b.classList.contains('on') ? Math.max(1, ['', 'Намерение сохранить клиента', 'Отказ от сохранения клиента', 'Получено ходатайство'].indexOf(obOf(tgt()).act)) : 0), note: 'ФЛ выбирает действие, ИП и ЮЛ оставляют комментарий. Действие необратимо' },
    'Увед.': { s: [['Нет новых', ''], ['Есть новые', 'o']] },
    СК: { s: yn('Чувствительный клиент') },
    УС: { s: yn('Сообщение УС доступно для прочтения', 'Сообщение отсутствует'), note: 'Для просмотра сообщений нажмите на индикатор в шапке кейса' },
    'Разм.': { s: yn('Размечено', 'Не размечено'), note: 'Для просмотра разметки нажмите на индикатор' },
    Преданиз: { s: [['Нет преданализа', ''], ['Есть действующий согласованный преданализ', 'g'], ['Отказ по преданализу', 'o']], cur: (b) => (b.classList.contains('h-g') ? 1 : b.classList.contains('h-o') ? 2 : 0), note: 'Для просмотра детальной информации нажмите на индикатор в шапке кейса' },
    Группа: { s: yn('Есть кейсы в группе «Контрагент по схеме»', 'Нет связанных кейсов'), note: 'Для просмотра связанных кейсов нажмите на индикатор в шапке кейса' },
    Кейс: { s: [], note: 'Открывает список кейсов' },
    Специфика: { s: yn('Есть, раскрывается списком') },
  };
  const hue = (l) => (FLAGS.find((f) => f[0] === l) || [])[3] || (Object.values(CL_SET).flat().find((f) => f[0] === l) || [])[2] || 'l';
  const el = document.createElement('div'); el.className = 'lgd'; el.setAttribute('role', 'tooltip'); $('#app').append(el);
  let timer = 0, cur = null;
  function show(b) {
    const label = b.querySelector('span').textContent, def = LG[label] || { s: yn('Есть') };
    const name = b.dataset.r.split(':')[0], h = hue(label), ic = b.querySelector('svg').outerHTML, on = b.classList.contains('on');
    const at = def.cur ? def.cur(b) : on ? 1 : 0;
    const dot = (c) => { const col = c === 'h' ? h : c.replace('i', ''); return `<i class="${col ? `h-${col}` : ''} ${c.includes('i') ? 'inf' : ''}">${ic}</i>`; };
    el.innerHTML = `<b>${esc(name)}</b>${name === label ? '' : `<small>${esc(label)}</small>`}${def.s.length ? `<ul>${def.s.map(([t, c], i) => `<li class="${i === at ? 'on' : ''}">${dot(c)}<span>${esc(t)}</span>${i === at ? '<em>сейчас</em>' : ''}</li>`).join('')}</ul>` : ''}${def.note ? `<p>${esc(def.note)}</p>` : ''}`;
    el.classList.add('on');
    const r = b.getBoundingClientRect(), a = $('#app').getBoundingClientRect(), w = el.offsetWidth, hgt = el.offsetHeight;
    const x = Math.max(12, Math.min(r.left - a.left, a.width - w - 12));
    const y = r.top - a.top - hgt - 10 > 8 ? r.top - a.top - hgt - 10 : r.bottom - a.top + 10;
    el.style.transform = `translate(${x}px,${y}px)`;
  }
  const hide = () => { clearTimeout(timer); cur = null; el.classList.remove('on'); };
  document.addEventListener('pointerover', (e) => {
    const b = e.target.closest?.('.sh');
    if (b === cur) return;
    clearTimeout(timer); cur = b;
    if (!b) { el.classList.remove('on'); return; }
    timer = setTimeout(() => { if (b.isConnected) show(b); }, 90);
  });
  document.addEventListener('focusin', (e) => { const b = e.target.closest?.('.sh'); if (b) { cur = b; show(b); } });
  document.addEventListener('focusout', hide);
  document.addEventListener('click', hide, true);
})();

</script>
<script>
// Запуск: сцена включена только в кабинете.
window.afterRender = (r) => {
  const home = !ROUTES[r] || r === 'home';
  $('#sFlow').classList.toggle('on', home);
  if (home) Flow.start(); else Flow.stop();
  $('#page').classList.toggle('over', home);
  fitTabs();
  shiftFx();
  document.querySelectorAll('.shs').forEach((b) => {
    const rd = b.querySelector('.rd'); if (!rd) return;
    b.addEventListener('pointerover', (e) => { const t = e.target.closest('.sh'); rd.textContent = t ? t.dataset.r : ''; });
    b.addEventListener('pointerleave', () => { rd.textContent = ''; });
  });
};
// Кабинет: деления загораются при первом показе, наведение подставляет значение в заголовок блока.
function shiftFx() {
  const g = document.querySelector('.psg'); if (!g) return;
  if (g.classList.contains('in')) {
    const io = new IntersectionObserver((e) => { if (!e[0].isIntersecting) return; g.classList.add('go'); ST.psIn = true; io.disconnect(); }, { root: $('#page'), threshold: .35 });
    io.observe(g);
  }
  g.querySelectorAll('.shf,.qtr').forEach((box) => {
    const rd = box.querySelector('.rd');
    box.addEventListener('pointerover', (e) => { let t = e.target.closest('[data-r]'); if (!box.contains(t)) t = null; rd.textContent = t ? t.dataset.r : rd.dataset.def; rd.classList.toggle('on', !!t); });
    box.addEventListener('pointerleave', () => { rd.textContent = rd.dataset.def; rd.classList.remove('on'); });
  });
}
// Вкладок больше, чем ширины: открытая встаёт по центру, на краю появляется стрелка к остальным.
function fitTabs() {
  document.querySelectorAll('.wk .lev').forEach((n) => {
    if (n.scrollWidth <= n.clientWidth + 2) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ic levn'; b.setAttribute('aria-label', 'Остальные вкладки');
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    const end = () => n.scrollLeft + n.clientWidth >= n.scrollWidth - 2;
    const paint = () => { const e = end(); b.classList.toggle('back', e); n.classList.toggle('fl-r', !e); n.classList.toggle('fl-l', n.scrollLeft > 2); };
    b.addEventListener('click', () => n.scrollBy({ left: end() ? -n.scrollWidth : n.clientWidth * .7, behavior: 'smooth' }));
    n.addEventListener('scroll', paint, { passive: true });
    n.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { n.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
    n.after(b);
    const on = n.querySelector('.on');
    if (on) n.scrollLeft = on.offsetLeft - (n.clientWidth - on.offsetWidth) / 2;
    paint();
  });
}
render();

</script>
