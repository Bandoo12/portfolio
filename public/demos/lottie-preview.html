<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lottie Preview</title>
<style>
body {
  background: #f2f2f2;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, sans-serif;
  flex-direction: column;
  gap: 24px;
}
.card {
  background: #fff;
  border-radius: 24px;
  padding: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
h2 { font-size: 17px; font-weight: 600; color: #141414; }
p  { font-size: 13px; color: #999; text-align: center; max-width: 260px; line-height: 1.5; }
button {
  padding: 10px 20px;
  background: #141414; color: #fff;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

<div class="card">
  <div id="lottie-container" style="width:160px;height:160px;"></div>
  <h2>Success Checkmark</h2>
  <p>Bounce-circle + trim path галочка</p>
  <button onclick="anim.goToAndPlay(0, true)">↺ Replay</button>

  container: document.getElementById('lottie-container'),
  renderer: 'svg',
  loop: false,
  autoplay: true,
  animationData: animData

  document.getElementById('lottie-container').innerHTML =
    '<p style="color:red;font-size:12px;">Failed to load</p>';

</html>
